<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro Run & Gun</title>
    <meta
      name="description"
      content="A 1990s-style side-scrolling run-and-gun browser game prototype."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Seong&#39;s Retro Adventure</h1>
      <nav aria-label="Primary" class="byline">
        <a href="mailto:u8321477@anu.edu.au" class="email-link">u8321477@anu.edu.au</a>
        <a href="./assets.html" class="btn-white">View assets!</a>
      </nav>
    </header>
    <main>
      <div id="game-wrap">
        <canvas id="game" aria-label="Retro Run & Gun gameplay"></canvas>
        <div id="game-controls">
          <button id="fullscreen-btn" type="button" aria-label="Enter fullscreen" hidden>⛶</button>
          <button id="mute-btn" type="button" aria-label="Mute sound">🔊</button>
          <button id="pause-btn" type="button" aria-label="Pause">⏸</button>
          <button id="resume-btn" type="button" aria-label="Resume" hidden>▶</button>
          <button id="reset-btn" type="button" aria-label="Reset" hidden>↺</button>
        </div>
      </div>
      <div id="touch-controls" hidden>
        <button id="touch-left" type="button" aria-label="Move left">◀</button>
        <button id="touch-right" type="button" aria-label="Move right">▶</button>
        <button id="touch-jump" type="button" aria-label="Jump">▲</button>
        <button id="touch-fire" type="button" aria-label="Shoot">●</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
