<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in to YooHoo! Mail</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="banner">
      <p class="wordmark">
        <span>Y</span><span>o</span><span>o</span><span>H</span><span>o</span><span>o</span><span>!</span>
      </p>
      <p class="tagline">Mail Sign In</p>
      <nav aria-label="Primary">
        <a href="./index.html">Home</a> |
        <a href="./news.html">News</a> |
        <a href="./mail.html">Mail</a> |
        <a href="./clubs.html">Clubs</a>
      </nav>
    </header>
    <main>
      <h1>Sign in to YooHoo! Mail</h1>

      <form class="login" action="./mail.html" method="get">
        <div class="field">
          <label for="username">YooHoo! ID:</label>
          <input type="text" id="username" name="username" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" autocomplete="current-password" />
        </div>
        <div class="field field-checkbox">
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember">Remember me on this computer</label>
        </div>
        <button type="submit">Sign In</button>
        <p class="hint">(It's 1997. Any YooHoo! ID and password will do.)</p>
      </form>

      <p>New to YooHoo!? <span>Sign up free! (coming soon)</span></p>
    </main>
    <footer>
      <p><a href="./index.html">&laquo; Back to YooHoo! Home</a></p>
      <p>&copy; 1997 YooHoo! Inc.</p>
      <p>Student ID: u8321477</p>
    </footer>
  </body>
</html>
