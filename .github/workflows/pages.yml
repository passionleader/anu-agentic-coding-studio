name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            crit1-passionleader/pnpm-lock.yaml
            crit2-passionleader/pnpm-lock.yaml

      - name: Build crit1-passionleader
        working-directory: crit1-passionleader
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build crit2-passionleader
        working-directory: crit2-passionleader
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble combined site
        run: |
          mkdir -p site
          cp -r crit1-passionleader/dist site/crit1-passionleader
          cp -r crit2-passionleader/dist site/crit2-passionleader
          cp index.html site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Verify both deployed sites are online
        run: |
          base="${{ steps.deploy.outputs.page_url }}"
          for path in "crit1-passionleader/" "crit2-passionleader/"; do
            url="${base}${path}"
            ok=""
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
              if [ "$code" = "200" ]; then echo "online: $url"; ok=1; break; fi
              echo "attempt $i for $url: HTTP $code, retrying in 10s..."
              sleep 10
            done
            [ -n "$ok" ] || { echo "$url did not return 200"; exit 1; }
          done
